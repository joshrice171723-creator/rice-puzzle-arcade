location = /games { return 302 /games/; }
location = /games/api/events {
    client_max_body_size 64k;
    limit_req zone=studio_ingest burst=30 nodelay;
    access_log off;
    proxy_pass http://127.0.0.1:8090;
}
location ^~ /games/ {
    auth_basic "Game Studio";
    auth_basic_user_file /etc/nginx/studio.htpasswd;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;
    proxy_pass http://127.0.0.1:8090;
}
